<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="email-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="email-card" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#fcd34d" stop-opacity="0.45" />
    </linearGradient>
  </defs>
  <rect width="1200" height="900" rx="48" fill="#0f172a" />
  <rect x="120" y="140" width="960" height="620" rx="44" fill="url(#email-bg)" opacity="0.55" />
  <rect x="180" y="200" width="840" height="500" rx="36" fill="#0f172a" opacity="0.8" />
  <!-- n8n workflow visualization -->
  <circle cx="300" cy="400" r="50" fill="#111c34" opacity="0.9" />
  <circle cx="500" cy="400" r="50" fill="url(#email-card)" opacity="0.7" />
  <circle cx="700" cy="400" r="50" fill="#111c34" opacity="0.9" />
  <circle cx="900" cy="400" r="50" fill="url(#email-card)" opacity="0.7" />
  <!-- Connection lines -->
  <line x1="350" y1="400" x2="450" y2="400" stroke="#fbbf24" stroke-width="8" opacity="0.8" />
  <line x1="550" y1="400" x2="650" y2="400" stroke="#fbbf24" stroke-width="8" opacity="0.8" />
  <line x1="750" y1="400" x2="850" y2="400" stroke="#fbbf24" stroke-width="8" opacity="0.8" />
  <!-- Email envelopes -->
  <rect x="270" y="240" width="60" height="45" rx="8" fill="#fbbf24" opacity="0.6" />
  <rect x="670" y="240" width="60" height="45" rx="8" fill="#fcd34d" opacity="0.6" />
  <!-- Database icon -->
  <rect x="470" y="240" width="60" height="50" rx="12" fill="#10b981" opacity="0.6" />
  <text x="240" y="310" font-family="'Inter',sans-serif" font-size="36" fill="#fef3c7">Email Automation</text>
  <text x="240" y="350" font-family="'Inter',sans-serif" font-size="22" fill="#fde68a">n8n + Supabase + Outlook</text>
</svg>
